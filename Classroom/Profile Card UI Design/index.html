<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card UI Design</title>
    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
        <div class="image">
            <div class="profile-img"></div>
        </div>
        <div class="text-data">
            <span class="name">Farhan Syed</span>
            <span class="job">Lover & Husband</span>
        </div>
        <div class="media-button">
            <a href="#" style="background-color: #ff3d7e;" class="link">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="#" style="background-color: #0854ed;" class="link">
                <i class="fa-brands fa-discord"></i>
            </a>
            <a href="#" style="background-color: red;" class="link">
                <i class="fa-brands fa-youtube"></i>
            </a>
            <a href="#" style="background-color: rgb(53, 177, 3);" class="link">
                <i class="fa-brands fa-whatsapp"></i>
            </a>
        </div>
        <div class="buttons">
            <button class="button">Date</button>
            <button class="button">Text</button>
        </div>
        <div class="analytics">
            <div class="data">
                <i class="fa-solid fa-heart"></i>
                <span class="number">50k</span>
            </div>
            <div class="data">
                <i class="fa-solid fa-comment"></i>
                <span class="number">30k</span>
            </div>
            <div class="data">
                <i class="fa-solid fa-share"></i>
                <span class="number">80k</span>
            </div>
        </div>
    </div>
</body>
</html>
